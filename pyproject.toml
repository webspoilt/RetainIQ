[project]
name = "retainiq"
version = "1.0.0"
description = "AI-Assisted Customer Retention & Churn Cohort Analytics Platform"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
