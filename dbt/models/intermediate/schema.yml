version: 2

models:
  - name: int_customer_features
    description: "Intermediate feature-engineered customer dataset."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: tenure_bucket
        tests:
          - not_null
          - accepted_values:
              values: ['0-2 months', '3-11 months', '12+ months']
