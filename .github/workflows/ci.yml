name: RetainIQ CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: retention_analytics
          POSTGRES_USER: retainiq
          POSTGRES_PASSWORD: retainiq_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff lint & format check
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run pytest
        env:
          LLM_PROVIDER: mock
        run: pytest -v

      - name: Initialize PostgreSQL schema & run dbt
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: retention_analytics
          POSTGRES_USER: retainiq
          POSTGRES_PASSWORD: retainiq_local_dev
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U $POSTGRES_USER -d $POSTGRES_DB -f sql/01_schema.sql
          python -m src.ingest
          cp dbt/profiles.yml.example dbt/profiles.yml
          cd dbt && dbt debug && dbt run && dbt test
